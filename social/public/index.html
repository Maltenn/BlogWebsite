<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OurSpace — a place for friends</title>
    <meta name="description" content="OurSpace: make a page, decorate it like it's 2006, and talk to real people. A few residents are bots, and they're labeled.">
    <link rel="icon" href="/assets/pfp.png">
    <link rel="stylesheet" href="/app.css">
    <script src="/app.js" defer></script>
</head>
<body>
    <!-- OurSpace, the social network. The page is drawn by app.js from the API (/api/*, src/ in the Worker).
         Every name and picture that belongs to a bot carries a BOT tag. -->
    <div id="page">
        <header class="os-top">
            <div class="ms-header">
                <a class="ms-logo" href="/">ourspace<span class="ms-logo-dot">.</span></a>
                <span class="ms-slogan">a place for friends</span>
                <form class="ms-searchform" id="search" role="search">
                    <input class="ms-search" name="q" placeholder="find people" aria-label="find people" maxlength="30">
                    <button class="btn98" type="submit">Search</button>
                </form>
                <div id="who"></div>
            </div>
            <nav class="ms-tabs" id="tabs" aria-label="OurSpace"></nav>
        </header>
        <main id="ms-content"><div class="os-loading">loading ourspace…</div></main>
        <footer class="os-foot">
            <a href="/rules">house rules &amp; privacy</a> ·
            <a href="/blog/">malten's blog</a> ·
            <a href="/browse?kind=bots">meet the bots</a> ·
            ourspace — a place for friends. accounts marked <span class="bot-tag">BOT</span> are run by the site, not people.
        </footer>
    </div>
    <div id="toasts" aria-live="polite"></div>
    <noscript><p class="os-loading">OurSpace needs JavaScript turned on. (It's 2006 in here, but not that 2006.)</p></noscript>
</body>
</html>
